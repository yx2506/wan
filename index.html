<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>拼团自查站</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;font-family:system-ui}
body{max-width:1200px;margin:0 auto;padding:16px;background:#f7f8fa}
.card{background:#fff;border-radius:8px;padding:16px;margin-bottom:12px;box-shadow:0 1px 4px #00000015}
input,select,button{padding:8px 10px;border:1px solid #ccc;border-radius:4px;margin:4px 0}
button{cursor:pointer;background:#4078f2;color:#fff;border:none}
button.danger{background:#f56c6c}
button.success{background:#67c23a}
table{width:100%;border-collapse:collapse;margin:10px 0}
th,td{border:1px solid #ddd;padding:8px;text-align:center}
th{background:#f0f2f5}
.hide{display:none}
</style>
</head>
<body>
<div id="app">
  <div class="card" id="loginBox">
    <h3>登录</h3>
    <input type="text" id="loginName" placeholder="昵称">
    <input type="password" id="loginPwd" placeholder="密码">
    <button onclick="login()">登录</button>
  </div>

  <div id="mainBox" class="hide">
    <div class="card">
      <span>当前用户：<b id="curUser"></b>｜角色：<b id="curRole"></b></span>
      <button onclick="logout()">退出登录</button>
    </div>

    <!-- 管理员区域 -->
    <div id="adminArea" class="hide">
      <div class="card">
        <h4>邮费设置（总邮费自动分摊）</h4>
        <input type="number" step="0.01" id="totalPostage" placeholder="整单总邮费">
        <button onclick="savePostage()">保存邮费配置</button>
      </div>

      <div class="card">
        <h4>新增订单</h4>
        <input type="text" id="mName" placeholder="团员昵称">
        <input type="text" id="char" placeholder="角色">
        <input type="text" id="item" placeholder="柄名/商品">
        <input type="number" id="num" placeholder="数量">
        <input type="number" step="0.01" id="price" placeholder="单品单价">
        <button onclick="addOrder()" class="success">添加订单</button>
        <button onclick="exportExcel()" class="success">导出全部Excel</button>
      </div>
    </div>

    <div class="card">
      <h4>订单列表</h4>
      <table>
        <thead>
          <tr>
            <th>团员</th>
            <th>角色</th>
            <th>商品</th>
            <th>数量</th>
            <th>单价</th>
            <th>商品小计</th>
            <th>分摊邮费</th>
            <th>合计应付</th>
            <th>状态</th>
            <th id="opTh">操作</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>

    <div class="card">
      <h4>团员金额汇总</h4>
      <div id="summaryBox"></div>
    </div>
  </div>
</div>

<script>
// ===================== 已填入你提供的Supabase信息 =====================
const SUPABASE_URL = "https://ymrtivdluzupokxljtec.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InltcnRpdmRsdXp1cG9reGxqdGVjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxOTMwOTUsImV4cCI6MjEwMTc2OTA5NX0.4gQ2ACtn61eBWAFY5SYjV71cW7assOJ0VsdWwNnPU2Y";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
// =====================================================================

let currentUser = null;
let postageSetting = {total:0, avg:0};

// Supabase 建表SQL（复制到SQL编辑器执行）
/*
CREATE TABLE user_auth (
  id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
  nickname TEXT NOT NULL,
  password TEXT NOT NULL,
  role TEXT NOT NULL CHECK (role IN ('admin','member'))
);

CREATE TABLE orders (
  id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
  member_name TEXT NOT NULL,
  character TEXT NOT NULL,
  item_name TEXT NOT NULL,
  count INT NOT NULL,
  price DECIMAL(10,2) NOT NULL,
  goods_sum DECIMAL(10,2) NOT NULL DEFAULT 0,
  status TEXT DEFAULT '未肾'
);

CREATE TABLE postage_config (
  id INT PRIMARY KEY DEFAULT 1,
  total_postage DECIMAL(10,2) DEFAULT 0
);

-- 测试账号插入示例
INSERT INTO user_auth (nickname,password,role) VALUES ('团长','123456','admin');
INSERT INTO user_auth (nickname,password,role) VALUES ('团员A','1111','member');
*/

async function login(){
  const name = document.getElementById('loginName').value.trim();
  const pwd = document.getElementById('loginPwd').value;
  const {data} = await supabase.from('user_auth').select('*').eq('nickname',name).eq('password',pwd).single();
  if(!data){
    alert('账号或密码错误');
    return;
  }
  currentUser = data;
  renderMain();
  loadAll();
}

function logout(){
  currentUser = null;
  document.getElementById('loginBox').classList.remove('hide');
  document.getElementById('mainBox').classList.add('hide');
}

function renderMain(){
  document.getElementById('loginBox').classList.add('hide');
  document.getElementById('mainBox').classList.remove('hide');
  document.getElementById('curUser').innerText = currentUser.nickname;
  document.getElementById('curRole').innerText = currentUser.role;
  if(currentUser.role === 'admin'){
    document.getElementById('adminArea').classList.remove('hide');
    document.getElementById('opTh').classList.remove('hide');
  }else{
    document.getElementById('adminArea').classList.add('hide');
    document.getElementById('opTh').classList.add('hide');
  }
}

async function loadPostage(){
  const {data} = await supabase.from('postage_config').select('*').single();
  if(data){
    postageSetting.total = Number(data.total_postage);
    document.getElementById('totalPostage').value = postageSetting.total;
  }
}

async function savePostage(){
  const val = parseFloat(document.getElementById('totalPostage').value)||0;
  await supabase.from('postage_config').upsert({id:1, total_postage:val});
  postageSetting.total = val;
  alert('保存成功');
  loadAll();
}

async function loadAll(){
  await loadPostage();
  const {data:orders} = await supabase.from('orders').select('*');
  let filterList = orders;
  if(currentUser.role !== 'admin'){
    filterList = orders.filter(o=>o.member_name === currentUser.nickname);
  }

  // 分摊邮费计算
  const members = [...new Set(orders.map(i=>i.member_name))];
  const avgPost = members.length > 0 ? postageSetting.total / members.length : 0;
  postageSetting.avg = avgPost;

  renderTable(filterList, avgPost);
  renderSummary(orders, avgPost);
}

function renderTable(list, avgPost){
  const tb = document.getElementById('tableBody');
  tb.innerHTML = '';
  list.forEach(row=>{
    const goodsSum = Number(row.count) * Number(row.price);
    const total = goodsSum + avgPost;
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${row.member_name}</td>
      <td>${row.character}</td>
      <td>${row.item_name}</td>
      <td>${row.count}</td>
      <td>${Number(row.price).toFixed(2)}</td>
      <td>${goodsSum.toFixed(2)}</td>
      <td>${avgPost.toFixed(2)}</td>
      <td><b>${total.toFixed(2)}</b></td>
      <td>${row.status}</td>
      <td class="${currentUser.role!=='admin'?'hide':''}">
        <button onclick="changeStatus('${row.id}','已肾')">已肾</button>
        <button class="danger" onclick="del('${row.id}')">删除</button>
      </td>
    `;
    tb.appendChild(tr);
  })
}

function renderSummary(allOrders, avgPost){
  const sumMap = {};
  allOrders.forEach(o=>{
    const name = o.member_name;
    if(!sumMap[name]) sumMap[name] = {goods:0};
    sumMap[name].goods += Number(o.count)*Number(o.price);
  })
  let html = '';
  for(let n in sumMap){
    const final = sumMap[n].goods + avgPost;
    html += `<p>${n}｜商品合计：${sumMap[n].goods.toFixed(2)}｜分摊邮费：${avgPost.toFixed(2)}｜应付总额：<b>${final.toFixed(2)}</b></p>`
  }
  document.getElementById('summaryBox').innerHTML = html;
}

async function addOrder(){
  const mName = document.getElementById('mName').value.trim();
  const char = document.getElementById('char').value.trim();
  const item = document.getElementById('item').value.trim();
  const num = parseInt(document.getElementById('num').value);
  const price = parseFloat(document.getElementById('price').value);
  if(!mName||!char||!item||!num||!price){
    alert('信息填写完整');
    return;
  }
  const goodsSum = num * price;
  await supabase.from('orders').insert([{
    member_name:mName,
    character:char,
    item_name:item,
    count:num,
    price:price,
    goods_sum:goodsSum,
    status:'未肾'
  }])
  alert('新增成功');
  loadAll();
}

async function changeStatus(id,st){
  await supabase.from('orders').update({status:st}).eq('id',id);
  loadAll();
}

async function del(id){
  if(!confirm('确认删除？'))return;
  await supabase.from('orders').delete().eq('id',id);
  loadAll();
}

// 导出Excel功能
function exportExcel(){
  const wb = XLSX.utils.book_new();
  const table = document.getElementById('tableBody');
  const rows = [['团员','角色','商品','数量','单价','商品小计','分摊邮费','合计应付','状态']];
  Array.from(table.children).forEach(tr=>{
    const arr = [];
    Array.from(tr.cells).forEach((td,i)=>{
      if(i<9) arr.push(td.innerText);
    })
    rows.push(arr);
  })
  const ws = XLSX.utils.aoa_to_sheet(rows);
  XLSX.utils.book_append_sheet(wb,ws,"拼团订单表");
  XLSX.writeFile(wb,"谷圈拼团订单.xlsx");
}
</script>
</body>
</html>
